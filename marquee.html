<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>
<body>
    <main>
        <h1><marquee scrollamount = "50" >WELCOME TO APEX MOTORS</marquee></h1>

        <h1><marquee direction ="right" behavior ="alternate" bgcolor="red" scrolldelay="200">WELCOME TO APEX MOTORS</marquee></h1>

        <h1><marquee direction ="up" height ="400px" bgcolor="yellow">WELCOME TO APEX MOTORS</marquee></h1>

        <h1><marquee direction="down"height ="400px" bgcolor="pink"  >WELCOME TO APEX MOTORS</marquee></h1>
    </main>
    
</body>
</html>
