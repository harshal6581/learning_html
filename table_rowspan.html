<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Rowspan</title>
</head>
<body>
    <h3>Rowspan Table</h3>

    <table border="3">
        <thead>
            <tr>
                <th>
                    Language
                </th>
                <th> Details </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="3"> Web Design </td>
                <td>HTML</td>
            </tr>

            <tr>
                <td>CSS</td>
            </tr>

            <tr>
                <td>JS</td>
            </tr>

            <tr>
                <td rowspan="4">RCB</td>
                <td>Virat</td>
            </tr>

            <tr>
                <td>Rajat</td>
            </tr> 

            <tr>
                <td>Bhuvi</td>
            </tr>

            <tr>
                <td>King</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
