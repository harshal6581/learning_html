<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Types</title>
</head>
<body>
    <h2>ALL INPUT TYPES IN HTML</h2>

    <form>
        <label>First Name</label>
        <input type ="text" placeholder="Enter Your Name"/>
        <br><br>

        <label>Last Name</label>
        <input type="text" placeholder="Enter Your Last Name"/>
        <br><br>

        <label>Email</label>
        <input type ="email" placeholder="Enter Email"/>
        <br><br>

        <label>Enter Fax Nymber</label>
        <input type="number" placeholder="Enter Fax Number"/>
        <br><br>

        <label>Select DOB</label>
        <input type="date"/>
        <label>Select Month</label>
        <input type="month"/>
        <label>Select Week</label>
        <input type="week"/>
        <br><br>

        <label>Select Time</label>
        <input type="time"/>
        <label >Date and Time</label>
        <input type="datetime-local"/>

        <br><br>

        <label>Choose city</label>
        <input type="checkbox" checked>Mumbai
        <input type="checkbox">Pune
        <input type="checkbox">Nashik
        <input type="checkbox">Latur
        <br><br>

        <label>Select Gender</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Others
        <br><br>

        <label>Select colour</label>
        <input type="color"/>

        <label>Select Range</label>
        <input type="range"/>

        <label>Upload Docs</label>
        <input type="file" multiple/>

        <br><br>

        <label>Enter Password</label>
        <input type="password" placeholder="Enter Password"/>

        <label>Search</label>
        <input type="search" placeholder="Enter to Search..!"/>

        <br><br>

        <label>Enter Url</label>
        <input type="url" placeholder="https://example.com"/>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number"/>

        <br><br>

        <label>Select Country</label>
        <select>
            <option>Choose...</option>
            <option>USA</option>
            <option>UK</option>
            <option>Japan</option>
            <option>France</option>
        </select>
        <br><br><br>

        <label>Enter Address</label>
        <textarea row="5" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Submit"/>
        <input type="button" value="button"/>
        <input type="reset" value="Reset"/>

        <br>br>



    </form>


    
</body>
</html>
